openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Reports
    description: Irrigation test report storage and retrieval.
  - name: Admin
    description: Admin-only endpoints.
  - name: HelpRequests
    description: User help request endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /reports:
    post:
      tags: [Reports]
      operationId: saveReport
      summary: Save an irrigation test report
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveReportRequest'
      responses:
        '201':
          description: Report saved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags: [Reports]
      operationId: getMyReports
      summary: Get reports for the authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: List of reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /reports/{id}:
    get:
      tags: [Reports]
      operationId: getReportById
      summary: Get a single report by ID
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
        '404':
          description: Report not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/reports:
    get:
      tags: [Admin]
      operationId: adminGetAllReports
      summary: Get all reports (admin only)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: List of all reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReportListEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Admin access required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /help-requests:
    post:
      tags: [HelpRequests]
      operationId: submitHelpRequest
      summary: Submit a help request (can't find report)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelpRequestInput'
      responses:
        '201':
          description: Help request submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequestEnvelope'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/help-requests:
    get:
      tags: [Admin]
      operationId: adminGetHelpRequests
      summary: Get all help requests (admin only)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: List of help requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequestListEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Admin access required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/help-requests/{id}/resolve:
    patch:
      tags: [Admin]
      operationId: adminResolveHelpRequest
      summary: Mark a help request as resolved (admin only)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Help request resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequestEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Admin access required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Help request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    SaveReportRequest:
      type: object
      required: [reportData]
      properties:
        irrigatorType:
          type: [string, 'null']
        farmName:
          type: [string, 'null']
        assessorName:
          type: [string, 'null']
        testDate:
          type: [string, 'null']
        duPercent:
          type: [string, 'null']
        duStatus:
          type: [string, 'null']
        reportData:
          type: object
          additionalProperties: true
    ReportRecord:
      type: object
      required: [id, createdAt, reportData]
      properties:
        id:
          type: string
        userId:
          type: [string, 'null']
        irrigatorType:
          type: [string, 'null']
        farmName:
          type: [string, 'null']
        assessorName:
          type: [string, 'null']
        testDate:
          type: [string, 'null']
        duPercent:
          type: [string, 'null']
        duStatus:
          type: [string, 'null']
        reportData:
          type: object
          additionalProperties: true
        createdAt:
          type: string
    ReportEnvelope:
      type: object
      required: [report]
      properties:
        report:
          $ref: '#/components/schemas/ReportRecord'
    ReportListEnvelope:
      type: object
      required: [reports]
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/ReportRecord'
    AdminReportRecord:
      type: object
      required: [id, createdAt, reportData]
      properties:
        id:
          type: string
        userId:
          type: [string, 'null']
        userEmail:
          type: [string, 'null']
        userName:
          type: [string, 'null']
        irrigatorType:
          type: [string, 'null']
        farmName:
          type: [string, 'null']
        assessorName:
          type: [string, 'null']
        testDate:
          type: [string, 'null']
        duPercent:
          type: [string, 'null']
        duStatus:
          type: [string, 'null']
        reportData:
          type: object
          additionalProperties: true
        createdAt:
          type: string
    AdminReportListEnvelope:
      type: object
      required: [reports]
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/AdminReportRecord'
    HelpRequestInput:
      type: object
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
        contactInfo:
          type: [string, 'null']
    HelpRequestRecord:
      type: object
      required: [id, description, resolved, createdAt]
      properties:
        id:
          type: string
        userId:
          type: [string, 'null']
        userEmail:
          type: [string, 'null']
        userName:
          type: [string, 'null']
        description:
          type: string
        contactInfo:
          type: [string, 'null']
        resolved:
          type: boolean
        createdAt:
          type: string
    HelpRequestEnvelope:
      type: object
      required: [helpRequest]
      properties:
        helpRequest:
          $ref: '#/components/schemas/HelpRequestRecord'
    HelpRequestListEnvelope:
      type: object
      required: [helpRequests]
      properties:
        helpRequests:
          type: array
          items:
            $ref: '#/components/schemas/HelpRequestRecord'
