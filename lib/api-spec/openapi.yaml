openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Reports
    description: Irrigation test report storage and retrieval.
  - name: Farms
    description: Farms and their saved irrigators.
  - name: Account
    description: The signed-in user's profile settings.
  - name: Admin
    description: Admin-only endpoints.
  - name: HelpRequests
    description: User help request endpoints.
  - name: Billing
    description: Stripe subscription checkout and billing portal.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /auth/account-type:
    put:
      tags: [Auth]
      operationId: setAccountType
      summary: Choose whether the signed-in user is a farmer or a consultant
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAccountTypeRequest'
      responses:
        '200':
          description: Account type saved; returns the updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '400':
          description: Invalid account type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /reports:
    post:
      tags: [Reports]
      operationId: saveReport
      summary: Save an irrigation test report
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveReportRequest'
      responses:
        '201':
          description: Report saved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags: [Reports]
      operationId: getMyReports
      summary: Get reports for the authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: List of reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /reports/{id}:
    get:
      tags: [Reports]
      operationId: getReportById
      summary: Get a single report by ID
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportEnvelope'
        '404':
          description: Report not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /farms:
    get:
      tags: [Farms]
      operationId: getMyFarms
      summary: Get the farms (and their irrigators) the authenticated user can access
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Live farms and irrigators.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmDirectoryEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [Farms]
      operationId: saveFarm
      summary: Create or update a farm (Last-Write-Wins on clientUpdatedAt)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveFarmRequest'
      responses:
        '201':
          description: The authoritative farm record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmEnvelope'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Not allowed to edit this farm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /irrigators:
    post:
      tags: [Farms]
      operationId: saveIrrigator
      summary: Create or update a saved irrigator (Last-Write-Wins on clientUpdatedAt)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveIrrigatorRequest'
      responses:
        '201':
          description: The authoritative irrigator record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IrrigatorEnvelope'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Not allowed to edit this farm's irrigators.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The irrigator's farm has not been saved yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /account/business-profile:
    get:
      tags: [Account]
      operationId: getBusinessProfile
      summary: The signed-in user's business details printed on their reports
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: The business profile (fields are null until filled in).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfileEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags: [Account]
      operationId: setBusinessProfile
      summary: Replace the signed-in user's business profile
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessProfile'
      responses:
        '200':
          description: The saved business profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfileEnvelope'
        '400':
          description: Invalid profile (e.g. logo too large or not an image).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /reports/{id}/share:
    get:
      tags: [Reports]
      operationId: getReportShare
      summary: The live share link for one of my reports, if any
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: The current share link, or null when the report is not shared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Report not found (or not synced to the server yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [Reports]
      operationId: createReportShare
      summary: Share a report with the farmer via a public read-only link
      description: >-
        Creates a share link for the report, or returns the existing live one.
        Anyone with the link can view and print the report without an account.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: The report's share link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Report not found (or not synced to the server yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Sharing is not set up on the server yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [Reports]
      operationId: revokeReportShare
      summary: Stop sharing a report (its links stop working immediately)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Sharing revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Report not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /shared/{token}:
    get:
      tags: [Reports]
      operationId: getSharedReport
      summary: Read a shared report by its public token (no account needed)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The shared report and the consultant's branding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedReportEnvelope'
        '404':
          description: No live share with that token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/reports:
    get:
      tags: [Admin]
      operationId: adminGetAllReports
      summary: Get all reports (admin only)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: List of all reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReportListEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Admin access required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /help-requests:
    post:
      tags: [HelpRequests]
      operationId: submitHelpRequest
      summary: Submit a help request (can't find report)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelpRequestInput'
      responses:
        '201':
          description: Help request submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequestEnvelope'
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/help-requests:
    get:
      tags: [Admin]
      operationId: adminGetHelpRequests
      summary: Get all help requests (admin only)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: List of help requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequestListEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Admin access required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/help-requests/{id}/resolve:
    patch:
      tags: [Admin]
      operationId: adminResolveHelpRequest
      summary: Mark a help request as resolved (admin only)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Help request resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequestEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Admin access required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Help request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /billing/status:
    get:
      tags: [Billing]
      operationId: getBillingStatus
      summary: Get subscription status and annual price
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Billing status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingStatus'
  /billing/checkout:
    post:
      tags: [Billing]
      operationId: createBillingCheckout
      summary: Create a Stripe Checkout session for the annual subscription
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingCheckoutRequest'
      responses:
        '200':
          description: Checkout URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRedirect'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Stripe is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /billing/portal:
    post:
      tags: [Billing]
      operationId: createBillingPortal
      summary: Create a Stripe Customer Portal session
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Portal URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingRedirect'
        '400':
          description: No billing account yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    ReportId:
      name: id
      in: path
      required: true
      description: The report's UUID.
      schema:
        type: string
  schemas:
    BusinessProfile:
      type: object
      description: >-
        A consultant's business details, printed in the header of their reports
        and on shared report pages. Every field may be null.
      required: [businessName, contactName, phone, email, website, logo]
      properties:
        businessName:
          type: [string, 'null']
          maxLength: 120
        contactName:
          type: [string, 'null']
          maxLength: 120
          description: Also used to prefill the assessor name on new tests.
        phone:
          type: [string, 'null']
          maxLength: 40
        email:
          type: [string, 'null']
          maxLength: 160
        website:
          type: [string, 'null']
          maxLength: 200
        logo:
          type: [string, 'null']
          description: Small PNG/JPEG/WebP as a `data:image/...;base64,` URL (max ~200 KB).
    BusinessProfileEnvelope:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: '#/components/schemas/BusinessProfile'
    ShareLink:
      type: object
      required: [token, url, createdAt]
      properties:
        token:
          type: string
        url:
          type: string
          description: Absolute public URL of the shared report page.
        createdAt:
          type: string
    ShareLinkEnvelope:
      type: object
      required: [share]
      properties:
        share:
          oneOf:
            - $ref: '#/components/schemas/ShareLink'
            - type: 'null'
    SharedReportEnvelope:
      type: object
      required: [report, branding]
      properties:
        report:
          $ref: '#/components/schemas/ReportRecord'
        branding:
          oneOf:
            - $ref: '#/components/schemas/BusinessProfile'
            - type: 'null'
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        accountType:
          $ref: '#/components/schemas/AccountType'
    AccountType:
      type: string
      enum: [farmer, consultant]
      description: Farmers test their own farm; consultants test farms for clients. Defaults to farmer.
    SetAccountTypeRequest:
      type: object
      required: [accountType]
      properties:
        accountType:
          $ref: '#/components/schemas/AccountType'
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    SaveReportRequest:
      type: object
      required: [reportData]
      properties:
        id:
          type: string
          description: >-
            Client-generated UUID for offline-first upserts. If omitted, the
            server generates one (backward compatible with older clients).
        clientUpdatedAt:
          type: string
          description: >-
            ISO-8601 timestamp of the client's last local modification, used for
            Last-Write-Wins conflict resolution. Defaults to server time if omitted.
        irrigatorType:
          type: [string, 'null']
        farmName:
          type: [string, 'null']
        assessorName:
          type: [string, 'null']
        testDate:
          type: [string, 'null']
        duPercent:
          type: [string, 'null']
        duStatus:
          type: [string, 'null']
        farmId:
          type: [string, 'null']
          description: >-
            Farm the report belongs to. Only applied when the caller is a member
            of that farm; omitting it keeps the report's existing farm link.
        irrigatorId:
          type: [string, 'null']
        reportData:
          type: object
          additionalProperties: true
    ReportRecord:
      type: object
      required: [id, createdAt, reportData]
      properties:
        id:
          type: string
        userId:
          type: [string, 'null']
        irrigatorType:
          type: [string, 'null']
        farmName:
          type: [string, 'null']
        assessorName:
          type: [string, 'null']
        testDate:
          type: [string, 'null']
        duPercent:
